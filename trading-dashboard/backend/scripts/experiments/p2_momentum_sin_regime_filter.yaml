# Simbolo contra el que se mide la fuerza relativa (momentum vs el mercado).
benchmark_symbol: SPY

# Dias de historia (calendario aprox.) que se piden para el scan en vivo.
lookback_days: 400

# Pausa entre cada simbolo del universo durante un scan (segundos). Con un
# universo grande (ej. S&P 500 completo) escanear sin pausa manda cientos de
# pedidos seguidos a la API gratuita de Yahoo Finance, lo que puede gatillar
# un bloqueo temporal. Subila si ves errores de datos frecuentes en scans
# completos; bajala (0 esta permitido) si tu universo es chico.
scan_request_delay_seconds: 0.15

# Filtro de tendencia: solo se considera "en tendencia" si precio > SMA rapida > SMA lenta.
sma_fast: 20
sma_slow: 50

# Momentum: retorno (%) en cada ventana, en dias de trading.
momentum_lookback_days: 63   # ~3 meses
momentum_short_days: 21      # ~1 mes

# RSI(periodo) y rango "saludable" para considerar continuacion de tendencia
# (evita comprar sobrecompra extrema o nombres ya rompiendo a la baja).
rsi_period: 14
rsi_min: 40
rsi_max: 75

# Liquidez minima en DOLARES (volumen promedio 20 dias x precio) para no
# proponer nombres iliquidos en terminos de dinero realmente operado.
min_avg_dollar_volume: 1000000

# Cuantos candidatos como maximo se consideran "top" en cada scan/backtest.
top_n: 10

# ATR (Average True Range) usado para sugerir el stop-loss de cada candidato.
atr_period: 14
stop_loss_atr_multiplier: 1.5

# Maximo de dias en una posicion antes de cerrarla por tiempo (swing trading:
# dias a semanas, no mantiene posiciones indefinidamente).
max_holding_days: 20

# Filtro de regimen: no se sugieren entradas largas si el benchmark esta por
# debajo de su propia SMA de regimen (mercado en tendencia bajista de fondo).
regime_filter_enabled: true
regime_sma_period: 200

# Dias antes de earnings estimados en los que no se sugieren nuevas entradas
# (gap risk que el stop-loss basado en ATR no cubre).
earnings_blackout_days: 5

# Filtro de proximidad al maximo de 52 semanas: solo se consideran entradas en
# simbolos a no mas de max_pct_below_52w_high (%) por debajo de su maximo de 52
# semanas. Favorece lideres cerca de maximos (breakouts) en vez de nombres ya
# extendidos a la baja (efecto momentum del "52-week high").
near_high_filter_enabled: true
max_pct_below_52w_high: 15.0

# Anos de historia usados al correr un backtest de la estrategia.
backtest_years: 3

# Costos de transaccion asumidos en el backtest. backtest_assumed_capital_usd
# es solo una referencia para convertir la comision en % por operacion.
backtest_assumed_capital_usd: 100000
commission_per_trade_usd: 1.0
slippage_pct: 0.05

# Escaneo proactivo en background: si esta habilitado, el backend corre el
# screener solo cada auto_scan_interval_minutes y arma ordenes de compra en
# borrador para simbolos que recien empiezan a pasar los filtros. Esas
# ordenes quedan pendientes de aprobacion manual, nunca se ejecutan solas.
auto_scan_enabled: false
auto_scan_interval_minutes: 30

# Tope de ordenes en borrador que el escaneo proactivo puede crear por ciclo
# (ademas no draftea mas alla de los cupos libres respecto a top_n contando lo
# que ya esta pendiente). Evita inundar la cola si muchos simbolos pasan a la vez.
max_auto_drafts_per_cycle: 3

# Oportunista: pesos de score invertidos respecto al default de
# OpportunisticConfig (momentum 0.3077 / room_to_grow 0.1538 -> 0.1538 /
# 0.3077), para que domine el componente alineado con la tesis declarada de
# la estrategia ("todavia lejos del maximo de 52 semanas") en vez del que la
# contradice (premiar lo que ya subio). Validado con backtest + walk-forward
# (3 folds) el 2026-06-23: retorno acumulado 24.6% -> 68.5%, Sharpe 0.42 ->
# 0.80, mejora sostenida en 2 de 3 folds (ver scripts/experiments/
# p1_momentum_sin_1m_oportunista_swap.yaml para el detalle del experimento).
opportunistic:
  score_weight_momentum: 0.1538
  score_weight_room_to_grow: 0.3077

# --- Experimento P2 (analisis momentum/oportunista 2026-06-23) ---
# No tocar screener.yaml: copia + override para correr contra el mismo
# codigo y comparar contra la config base (con el swap de Oportunista P1 ya
# aplicado) sin afectar el deploy en vivo.
#
# Momentum: apaga el filtro de regimen (SPY > su SMA200). Confirmado en
# backtest.py que SOLO Momentum usa este filtro (Oportunista nunca lo
# consulta, ver _collect_opportunistic_trades), asi que este cambio aisla
# el efecto en Momentum sin tocar Oportunista. Hipotesis: una SMA200 es un
# filtro lento -- saca de mercado tarde durante la caida y reintegra tarde
# durante la recuperacion (whipsaw) -- y eso explicaria por que el Fold 1
# (2021-2023, tramo bajista) del walk-forward de Momentum quedo tan negativo
# (-19% / sharpe -0.92) arrastrando el resultado del periodo completo muy
# por debajo del benchmark.
regime_filter_enabled: false
