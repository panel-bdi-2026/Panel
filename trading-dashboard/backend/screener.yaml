# Configuracion del radar de oportunidades (screener momentum/tecnico).
# Esto NO ejecuta ordenes: solo rankea candidatos. Cualquier orden que decidas
# enviar a partir de un candidato pasa igual por rules.yaml / RulesEngine.
# Ver README.md para el detalle de cada parametro.

# Universo de simbolos a escanear. Cortalo o ampliarlo segun tu criterio; uno
# mas largo tarda mas y consume mas cuota de la API gratuita de datos.
universe:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - AVGO
  - AMD
  - CRM
  - ADBE
  - NFLX
  - COST
  - TSLA
  - V
  - MA
  - UNH
  - JPM
  - XOM
  - CAT
  - DE
  - LIN
  - HD
  - LOW
  - NKE
  - DIS
  - PEP
  - KO
  - WMT
  - ORCL
  - QCOM

# Simbolo contra el que se mide la fuerza relativa (momentum vs el mercado).
benchmark_symbol: SPY

# Dias de historia (calendario aprox.) que se piden para el scan en vivo.
lookback_days: 400

# Filtro de tendencia: solo se considera "en tendencia" si precio > SMA rapida > SMA lenta.
sma_fast: 20
sma_slow: 50

# Momentum: retorno (%) en cada ventana, en dias de trading.
momentum_lookback_days: 63   # ~3 meses
momentum_short_days: 21      # ~1 mes

# RSI(periodo) y rango "saludable" para considerar continuacion de tendencia
# (evita comprar sobrecompra extrema o nombres ya rompiendo a la baja).
rsi_period: 14
rsi_min: 40
rsi_max: 75

# Liquidez minima en DOLARES (volumen promedio 20 dias x precio) para no
# proponer nombres iliquidos en terminos de dinero realmente operado.
min_avg_dollar_volume: 1000000

# Cuantos candidatos como maximo se consideran "top" en cada scan/backtest.
top_n: 10

# ATR (Average True Range) usado para sugerir el stop-loss de cada candidato.
atr_period: 14
stop_loss_atr_multiplier: 1.5

# Maximo de dias en una posicion antes de cerrarla por tiempo (swing trading:
# dias a semanas, no mantiene posiciones indefinidamente).
max_holding_days: 20

# Filtro de regimen: no se sugieren entradas largas si el benchmark esta por
# debajo de su propia SMA de regimen (mercado en tendencia bajista de fondo).
regime_filter_enabled: true
regime_sma_period: 200

# Dias antes de earnings estimados en los que no se sugieren nuevas entradas
# (gap risk que el stop-loss basado en ATR no cubre).
earnings_blackout_days: 5

# Anos de historia usados al correr un backtest de la estrategia.
backtest_years: 3

# Costos de transaccion asumidos en el backtest. backtest_assumed_capital_usd
# es solo una referencia para convertir la comision en % por operacion.
backtest_assumed_capital_usd: 100000
commission_per_trade_usd: 1.0
slippage_pct: 0.05

# Escaneo proactivo en background: si esta habilitado, el backend corre el
# screener solo cada auto_scan_interval_minutes y arma ordenes de compra en
# borrador para simbolos que recien empiezan a pasar los filtros. Esas
# ordenes quedan pendientes de aprobacion manual, nunca se ejecutan solas.
auto_scan_enabled: false
auto_scan_interval_minutes: 30

# Tope de ordenes en borrador que el escaneo proactivo puede crear por ciclo
# (ademas no draftea mas alla de los cupos libres respecto a top_n contando lo
# que ya esta pendiente). Evita inundar la cola si muchos simbolos pasan a la vez.
max_auto_drafts_per_cycle: 3
