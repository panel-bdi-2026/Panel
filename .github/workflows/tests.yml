name: Tests

on:
  push:
    branches:
      - claude/investment-dashboard-trades-x2vkn8
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-dashboard/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          API_KEY: test-key
          ANTHROPIC_API_KEY: test-key
        run: python -m pytest -q
